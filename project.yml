name: SixDoku
options:
  bundleIdPrefix: com.sixdoku
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    WATCHOS_DEPLOYMENT_TARGET: "10.0"
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  SharedCore:
    type: framework
    platform: auto
    sources: [SharedCore]
    settings:
      base:
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    supportedDestinations: [iOS, watchOS]

  SharedServices:
    type: framework
    platform: auto
    sources: [SharedServices]
    dependencies:
      - target: SharedCore
      - sdk: CloudKit.framework
    settings:
      base:
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    supportedDestinations: [iOS, watchOS]

  SixDoku:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [iOSApp]
    dependencies:
      - target: SharedCore
      - target: SharedServices
      - sdk: CloudKit.framework
    settings:
      base:
        INFOPLIST_FILE: iOSApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOSApp/SixDoku.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sixdoku.app
        DEVELOPMENT_TEAM: S332V7BC69
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleName: SixDoku
        CFBundleDisplayName: SixDoku
        CFBundleIdentifier: com.sixdoku.app
        CFBundleVersion: "1.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait"]
        UISupportedInterfaceOrientations~ipad: ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]

  SixDokuWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [WatchApp]
    dependencies:
      - target: SharedCore
      - target: SharedServices
      - sdk: CloudKit.framework
    settings:
      base:
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/SixDokuWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sixdoku.app.watch
        DEVELOPMENT_TEAM: S332V7BC69
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
    info:
      path: WatchApp/Info.plist
      properties:
        WKApplication: true
        CFBundleName: SixDokuWatch
        CFBundleDisplayName: SixDoku
        CFBundleIdentifier: com.sixdoku.app.watch
        CFBundleVersion: "1.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        WKCompanionAppBundleIdentifier: com.sixdoku.app

  SixDokuTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SixDokuTests]
    dependencies:
      - target: SharedCore
      - target: SharedServices
